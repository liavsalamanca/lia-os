name: Funciones de Supabase

# Publica las funciones del calendario al fusionar cambios en ellas, o a mano desde Actions.
on:
  push:
    branches: [main]
    paths: ['supabase/functions/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Comprobar configuración
        id: config
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            echo "::warning::Falta el secreto SUPABASE_ACCESS_TOKEN o la variable SUPABASE_PROJECT_REF. Revisa docs/SUPABASE.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.config.outputs.ready == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.config.outputs.ready == 'true'
        with:
          version: 2.120.0
      # Apple Calendar no envía sesión: el acceso lo da el enlace privado.
      # calendar-import comprueba la sesión dentro de la función.
      - name: Publicar funciones
        if: steps.config.outputs.ready == 'true'
        run: |
          supabase functions deploy calendar-feed --no-verify-jwt --project-ref "$PROJECT_REF"
          supabase functions deploy calendar-import --no-verify-jwt --project-ref "$PROJECT_REF"
